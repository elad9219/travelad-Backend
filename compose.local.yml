services:
  postgres:
    image: postgres:15-alpine
    container_name: travelad-demo-postgres
    restart: always
    environment:
      POSTGRES_DB: travelad_demo
      POSTGRES_USER: travelad_demo
      POSTGRES_PASSWORD: travelad_demo_local
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelad_demo -d travelad_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: travelad-demo-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
    name: travelad_demo_postgres_data
  redis_data:
    name: travelad_demo_redis_data