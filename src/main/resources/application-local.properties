server.port=8080

spring.datasource.url=jdbc:postgresql://127.0.0.1:15432/travelad_demo?sslmode=disable
spring.datasource.username=travelad_demo
spring.datasource.password=travelad_demo_local
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

spring.redis.url=
spring.redis.host=127.0.0.1
spring.redis.port=26379
spring.redis.username=
spring.redis.password=
spring.redis.ssl=false
spring.redis.database=0
spring.redis.connect-timeout=5s
spring.redis.timeout=5s