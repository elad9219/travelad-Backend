server.port=8080

spring.datasource.url=jdbc:postgresql://127.0.0.1:15432/travelad_demo?sslmode=disable
spring.datasource.username=travelad_demo
spring.datasource.password=travelad_demo_local
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

spring.data.redis.url=redis://127.0.0.1:26379/0
spring.data.redis.host=127.0.0.1
spring.data.redis.port=26379
spring.data.redis.username=
spring.data.redis.password=
spring.data.redis.ssl.enabled=false
spring.data.redis.database=0
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s

spring.data.redis.repositories.enabled=false
spring.jpa.open-in-view=false